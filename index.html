<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-skin="m">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1930" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="منصة التفوق" />
    <meta name="description" content="منصة التفوق لمراجعة شهادة البكالوريا الجزائرية: المواد، المصطلحات، التركيز وحساب المعدل." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_DZ" />
    <meta property="og:title" content="منصة التفوق — BAC Platform" />
    <meta property="og:description" content="مساحة مراجعة منظمة لطلبة البكالوريا في جميع الشعب." />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>منصة التفوق — مراجعة بكالوريا الجزائر</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="no-script" dir="rtl">هذه المنصة تحتاج إلى JavaScript ليتم تشغيلها. فعّل JavaScript في المتصفح ثم أعد تحميل الصفحة.</div>
    </noscript>
    <script>
      try {
        const saved = localStorage.getItem("bacStandard_v3") || localStorage.getItem("bacStandard_v1");
        const state = saved ? JSON.parse(saved) : null;
        if (state?.theme === "light" || state?.theme === "dark") document.documentElement.dataset.theme = state.theme;
        if (state?.profile?.gender === "m" || state?.profile?.gender === "f") document.documentElement.dataset.skin = state.profile.gender;
      } catch (_) { /* Keep the default dark theme when local storage is unavailable. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
