liste","translation":"الصحفي","example":"Le journaliste doit vérifier ses informations avant de publier un article.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «الصحفي». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-094","term":"l’actualité","translation":"الأخبار / الأحداث الجارية","example":"Les jeunes suivent l’actualité sur Internet.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «الأخبار / الأحداث الجارية». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-095","term":"l’opinion publique","translation":"الرأي العام","example":"Les médias peuvent influencer l’opinion publique.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «الرأي العام». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-096","term":"la liberté d’expression","translation":"حرية التعبير","example":"La liberté d’expression est un droit fondamental.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «حرية التعبير». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-097","term":"la discrimination","translation":"التمييز","example":"La société doit lutter contre toutes les formes de discrimination.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «التمييز». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-098","term":"l’intégration","translation":"الاندماج","example":"L’intégration des jeunes dans la société est importante.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «الاندماج». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-099","term":"l’immigration","translation":"الهجرة","example":"L’immigration est un phénomène qui concerne de nombreux pays.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «الهجرة». وتوضح الجملة استعماله في هذا السياق."},{"id":"fr-100","term":"la mondialisation","translation":"العولمة","example":"La mondialisation a renforcé les échanges entre les pays.","explanation":"مصطلح من محور «الإعلام والتواصل والحياة الاجتماعية»، ويعني «العولمة». وتوضح الجملة استعماله في هذا السياق."}]},"history":{"label":"التاريخ","icon":"🏛️","kind":"history","persons":[{"id":"hi-p01","name":"هاري ترومان Harry Truman","role":"رئيس الولايات المتحدة الأمريكية بين 1945 و1953، صاحب مبدأ ترومان 1947 القائم على احتواء الشيوعية، ويُعد من أبرز مؤسسي سياسة المواجهة الأمريكية في بداية الحرب الباردة."},{"id":"hi-p02","name":"جوزيف ستالين Joseph Stalin","role":"زعيم الاتحاد السوفياتي بين 1924 و1953، أحد أبرز قادة المعسكر الشرقي خلال الحرب الباردة، ارتبط عهده بتشدد الاتحاد السوفياتي تجاه الغرب وأزمات مثل أزمة برلين."},{"id":"hi-p03","name":"أندريه جدانوف Andrei Zhdanov","role":"سياسي سوفياتي، أحد قادة الحزب الشيوعي، صاحب مبدأ جدانوف 1947 الذي مثّل الرد السوفياتي على مبدأ ترومان، ومن مؤسسي الكومنفورم."},{"id":"hi-p04","name":"نيكيتا خروتشوف Nikita Khrushchev","role":"زعيم سوفياتي ورئيس للاتحاد السوفياتي بين 1953 و1964، اشتهر بسياسة التعايش السلمي، وارتبطت فترة حكمه بأزمة الصواريخ الكوبية سنة 1962."},{"id":"hi-p05","name":"جون كينيدي John F. Kennedy","role":"رئيس الولايات المتحدة بين 1961 و1963، ديمقراطي، عرفت فترة حكمه أزمة الصواريخ الكوبية 1962، واغتيل سنة 1963. وظهر تعريفه صراحة في موضوع بكالوريا لشعبة لغات أجنبية."},{"id":"hi-p06","name":"رونالد ريغان Ronald Reagan","role":"رئيس الولايات المتحدة بين 1981 و1989، اتخذ موقفًا متشددًا تجاه الاتحاد السوفياتي، وارتبط اسمه بمبادرة الدفاع الاستراتيجي «حرب النجوم»."},{"id":"hi-p07","name":"ميخائيل غورباتشوف Mikhail Gorbachev","role":"آخر زعماء الاتحاد السوفياتي، تولى القيادة سنة 1985، أطلق إصلاحات البيروسترويكا والغلاسنوست، وشهدت فترة حكمه نهاية الحرب الباردة وتفكك الاتحاد السوفياتي."},{"id":"hi-p08","name":"ليونيد بريجنيف Leonid Brezhnev","role":"زعيم سوفياتي تولى قيادة الاتحاد السوفياتي خلال فترة مهمة من الحرب الباردة، ارتبط عهده بأزمة براغ والتدخل السوفياتي في أفغانستان وبسياسة التسلح والمواجهة مع الغرب."},{"id":"hi-p09","name":"ونستون تشرشل Winston Churchill","role":"رئيس وزراء بريطاني، قاد بريطانيا خلال الحرب العالمية الثانية، وشارك في مؤتمر يالطا، واشتهر بخطابه الذي استخدم فيه تعبير «الستار الحديدي» لوصف انقسام أوروبا."},{"id":"hi-p10","name":"فرانكلين روزفلت Franklin Roosevelt","role":"رئيس الولايات المتحدة بين 1933 و1945، قاد بلاده خلال جزء كبير من الحرب العالمية الثانية، وشارك في مؤتمر يالطا 1945."},{"id":"hi-p11","name":"ريتشارد نيكسون Richard Nixon","role":"رئيس الولايات المتحدة بين 1969 و1974، شهدت فترته سياسة الانفراج بين القوتين، ووقّع معاهدة SALT I سنة 1972، واستقال على خلفية فضيحة ووترغيت."},{"id":"hi-p12","name":"جورج بوش الأب George H. W. Bush","role":"رئيس الولايات المتحدة بين 1989 و1993، عاصر نهاية الحرب الباردة، وشارك في مؤتمر مالطا 1989، وارتبط اسمه بإعلان النظام الدولي الجديد."},{"id":"hi-p13","name":"جورج مارشال George Marshall","role":"جنرال وسياسي أمريكي ووزير خارجية، صاحب مشروع مارشال 1947 لإعادة إعمار أوروبا، وكان المشروع جزءًا من استراتيجية الولايات المتحدة في مواجهة انتشار الشيوعية."},{"id":"hi-p14","name":"دوايت إيزنهاور Dwight Eisenhower","role":"رئيس الولايات المتحدة بين 1953 و1961، جنرال سابق وقائد عسكري بارز، ارتبط اسمه بمشروع إيزنهاور 1957 وسياسة ملء الفراغ، وشهدت فترته أزمة السويس."},{"id":"hi-p15","name":"جواهر لال نهرو Jawaharlal Nehru","role":"سياسي هندي وأول رئيس وزراء للهند المستقلة، من أبرز قادة حركة عدم الانحياز، وشارك في مؤتمر باندونغ 1955."},{"id":"hi-p16","name":"جوزيف بروز تيتو Josip Broz Tito","role":"رئيس يوغوسلافيا وزعيم سياسي، من أبرز مؤسسي حركة عدم الانحياز، وترأس مؤتمرها الأول في بلغراد سنة 1961."},{"id":"hi-p17","name":"جمال عبد الناصر","role":"رئيس مصر وأحد قادة ثورة 1952، من أبرز زعماء حركات التحرر، أمّم قناة السويس سنة 1956، وكان من مؤسسي حركة عدم الانحياز."},{"id":"hi-p18","name":"مصالي الحاج","role":"سياسي ومناضل جزائري، زعيم التيار الاستقلالي، أسس نجم شمال إفريقيا ثم حزب الشعب الجزائري ثم حركة انتصار الحريات الديمقراطية، وكان من أبرز دعاة استقلال الجزائر."},{"id":"hi-p19","name":"البشير الإبراهيمي","role":"عالم ومصلح وسياسي جزائري، من قادة جمعية العلماء المسلمين الجزائريين، خلف ابن باديس في رئاسة الجمعية، ودافع عن مقومات الشخصية الوطنية الجزائرية."},{"id":"hi-p20","name":"فرحات عباس","role":"سياسي جزائري وزعيم التيار الإدماجي في بدايته، أسس أحباب البيان والحرية ثم الاتحاد الديمقراطي للبيان الجزائري، وأصبح أول رئيس للحكومة المؤقتة للجمهورية الجزائرية سنة 1958."},{"id":"hi-p21","name":"محمد بلوزداد","role":"مناضل جزائري وأحد قادة حركة انتصار الحريات الديمقراطية، كان أول رئيس لـ المنظمة الخاصة سنة 1947."},{"id":"hi-p22","name":"حسين آيت أحمد","role":"مناضل وثوري جزائري، من أبرز عناصر المنظمة الخاصة، شارك في الحركة الوطنية والثورة، وكان من أعضاء الوفد الخارجي، واعتقل مع قادة الثورة في حادثة اختطاف الطائرة سنة 1956."},{"id":"hi-p23","name":"أحمد بن بلة","role":"مناضل وثوري جزائري، انخرط في حزب الشعب والمنظمة الخاصة، كان عضوًا في الوفد الخارجي، واعتقل سنة 1956، وأصبح أول رئيس للجزائر المستقلة سنة 1962."},{"id":"hi-p24","name":"محمد خيضر","role":"سياسي وثوري جزائري، انخرط في نجم شمال إفريقيا وحزب الشعب، وكان من عناصر المنظمة الخاصة والوفد الخارجي، واعتقل في حادثة اختطاف الطائرة سنة 1956."},{"id":"hi-p25","name":"محمد بوضياف","role":"مناضل وثوري جزائري، عضو في حزب الشعب والمنظمة الخاصة، ومن أعضاء مجموعة الـ22 واللجنة الستة، واعتقل سنة 1956، ثم أصبح رئيسًا للجزائر سنة 1992."},{"id":"hi-p26","name":"مصطفى بن بولعيد","role":"مناضل وثوري جزائري، من أعضاء المنظمة الخاصة ومن مؤسسي اللجنة الثورية للوحدة والعمل، وأحد أعضاء مجموعة الـ22 واللجنة الستة، وقائد الولاية الأولى الأوراس."},{"id":"hi-p27","name":"ديدوش مراد","role":"مناضل وثوري جزائري، ساهم في التحضير للثورة، وكان عضوًا في مجموعة الستة، وتولى قيادة الولاية الثانية الشمال القسنطيني."},{"id":"hi-p28","name":"العربي بن مهيدي","role":"من أبرز قادة الثورة الجزائرية، كان عضوًا في المنظمة الخاصة ومجموعة الـ22 واللجنة الستة، قاد الولاية الخامسة، وأشرف على إضراب الثمانية أيام خلال معركة الجزائر، واستشهد سنة 1957."},{"id":"hi-p29","name":"رابح بيطاط","role":"مناضل وثوري جزائري، عضو في حركة انتصار الحريات الديمقراطية واللجنة الثورية للوحدة والعمل ومجموعة الـ22 واللجنة الستة، وقائد الولاية الرابعة."},{"id":"hi-p30","name":"عبان رمضان","role":"مناضل وثوري جزائري، كان له دور بارز في تنظيم الثورة، ومن أهم مهندسي مؤتمر الصومام 1956، وارتبط اسمه بمبدأ أولوية السياسي على العسكري وأولوية الداخل على الخارج."},{"id":"hi-p31","name":"كريم بلقاسم","role":"مناضل وثوري جزائري، من أعضاء مجموعة الـ22 واللجنة الستة، وقائد المنطقة الثالثة منطقة القبائل، ومن أبرز قادة الثورة."},{"id":"hi-p32","name":"زيغود يوسف","role":"ثوري وقائد في الثورة الجزائرية، تولى قيادة الولاية الثانية، وقاد هجومات الشمال القسنطيني في 20 أوت 1955 التي ساهمت في إعطاء الثورة بعدًا شعبيًا وعسكريًا أكبر."},{"id":"hi-p33","name":"بن يوسف بن خدة","role":"مناضل وسياسي جزائري، قيادي في حركة انتصار الحريات الديمقراطية، وأصبح أمينًا عامًا للجنة المركزية، ثم تولى رئاسة الحكومة المؤقتة للجمهورية الجزائرية خلال المرحلة الأخيرة من الثورة."},{"id":"hi-p34","name":"هواري بومدين","role":"اسمه الحقيقي محمد بوخروبة، ثوري ورجل دولة جزائري، تولى قيادة أركان جيش التحرير ثم أصبح وزيرًا للدفاع بعد الاستقلال، وقاد التصحيح الثوري في 19 جوان 1965 وأصبح رئيسًا للجزائر."},{"id":"hi-p35","name":"الشاذلي بن جديد","role":"سياسي وعسكري جزائري شارك في الثورة، أصبح رئيسًا للجزائر سنة 1979، وشهدت فترة حكمه أحداث أكتوبر 1988 وصدور دستور 1989 الذي أقر التعددية السياسية."},{"id":"hi-p36","name":"عبد الرحمان فارس","role":"سياسي ومحامٍ جزائري، ترأس الهيئة التنفيذية المؤقتة بعد وقف إطلاق النار سنة 1962، وتولى تسيير المرحلة الانتقالية إلى غاية الاستقلال."},{"id":"hi-p37","name":"حسيبة بن بوعلي","role":"مناضلة وثورية جزائرية، شاركت في الثورة ضمن فدائيي معركة الجزائر، واستشهدت سنة 1957."},{"id":"hi-p38","name":"عيسات إيدير","role":"مناضل نقابي جزائري، من مؤسسي الاتحاد العام للعمال الجزائريين، وساهم في دعم الثورة من خلال العمل النقابي."},{"id":"hi-p39","name":"أحمد زبانة","role":"مناضل وثوري جزائري، شارك في التحضير للثورة وتنفيذ عملياتها الأولى، وأصبح من أوائل شهدائها الذين نفذ فيهم حكم الإعدام سنة 1956."},{"id":"hi-p40","name":"جاك سوستال Jacques Soustelle","role":"سياسي فرنسي، عُيّن واليًا عامًا على الجزائر سنة 1955، وصاحب مشروع سوستال، الذي استهدف مواجهة الثورة ومحاولة احتواء الشعب الجزائري."},{"id":"hi-p41","name":"جاك ماسو Jacques Massu","role":"جنرال فرنسي قاد القوات الفرنسية خلال معركة الجزائر، وارتبط اسمه بسياسة القمع والتعذيب خلال الثورة الجزائرية."},{"id":"hi-p42","name":"شارل ديغول Charles de Gaulle","role":"جنرال وسياسي فرنسي ومؤسس الجمهورية الفرنسية الخامسة سنة 1958، اتبع سياسة تجمع بين العمل العسكري والسياسي تجاه الثورة، ثم أقر مبدأ حق تقرير المصير وانتهت سياسته بالمفاوضات واتفاقيات إيفيان."},{"id":"hi-p43","name":"موريس شال Maurice Challe","role":"جنرال فرنسي وقائد عسكري، صاحب مخطط شال 1959 الذي استهدف القضاء على الثورة عسكريًا، وكان أحد المشاركين في محاولة الانقلاب على ديغول."},{"id":"hi-p44","name":"بيير مانديس فرانس Pierre Mendès France","role":"سياسي ورئيس وزراء فرنسي، ترأس الحكومة لفترة قصيرة خلال بداية الثورة الجزائرية، وسقطت حكومته في سياق تصاعد أزمة الجزائر."},{"id":"hi-p45","name":"لويس جوكس Louis Joxe","role":"سياسي فرنسي ووزير مكلف بالشؤون الجزائرية، ترأس الوفد الفرنسي في مفاوضات إيفيان ووقّع الاتفاقيات مع الجانب الجزائري."},{"id":"hi-p46","name":"غي مولييه Guy Mollet","role":"سياسي فرنسي ورئيس وزراء فرنسا خلال مرحلة مهمة من الثورة الجزائرية، اتخذت حكومته موقفًا متشددًا تجاه الثورة ووسعت العمليات العسكرية الفرنسية في الجزائر."},{"id":"hi-p47","name":"هواري بومدين","role":"رجل دولة جزائري، رئيس الجزائر بعد 1965، وارتبط اسمه بدعم حركات التحرر وحركة عدم الانحياز، لذلك يظهر أيضًا في الوحدة الثالثة."},{"id":"hi-p48","name":"جمال عبد الناصر","role":"رئيس مصر وأحد رموز حركات التحرر العربية، أمّم قناة السويس وقاد مصر خلال أزمة السويس، وكان من أبرز الداعمين للقضايا التحررية وعدم الانحياز."},{"id":"hi-p49","name":"المهاتما غاندي Mahatma Gandhi","role":"زعيم وطني هندي، قاد النضال ضد الاستعمار البريطاني بالاعتماد على المقاومة السلمية والعصيان المدني، وكان من أبرز رموز استقلال الهند."},{"id":"hi-p50","name":"جواهر لال نهرو","role":"زعيم وسياسي هندي، أول رئيس وزراء للهند المستقلة، ومن قادة حركة عدم الانحياز، وشارك في مؤتمر باندونغ."},{"id":"hi-p51","name":"محمد علي جناح Muhammad Ali Jinnah","role":"زعيم سياسي مسلم هندي، قاد الرابطة الإسلامية وطالب بإقامة دولة للمسلمين في شبه القارة الهندية، وأصبح أول حاكم عام لباكستان بعد استقلالها."},{"id":"hi-p52","name":"فيدال كاسترو Fidel Castro","role":"زعيم الثورة الكوبية، قاد الثورة التي أطاحت بنظام باتيستا سنة 1959، واتجه إلى النظام الاشتراكي وواجه النفوذ الأمريكي."},{"id":"hi-p53","name":"فولغينسيو باتيستا Fulgencio Batista","role":"سياسي وعسكري كوبي، حكم كوبا قبل انتصار الثورة الكوبية، وأطيح به سنة 1959 على يد الثورة بقيادة فيدال كاسترو."},{"id":"hi-p54","name":"تشي غيفارا Che Guevara","role":"ثائر وسياسي أرجنتيني الأصل، شارك في الثورة الكوبية إلى جانب فيدال كاسترو، واشتهر بأفكاره الثورية والاشتراكية ودعمه لحركات التحرر."},{"id":"hi-p55","name":"هوشي منه Ho Chi Minh","role":"زعيم سياسي وثوري فيتنامي، قاد الحركة التحررية ضد الاستعمار الفرنسي ثم التدخل الأمريكي، وأسهم في قيام جمهورية فيتنام الشمالية."},{"id":"hi-p56","name":"جياب Võ Nguyên Giáp","role":"قائد عسكري فيتنامي، قاد القوات الفيتنامية ضد فرنسا، واشتهر بانتصار قواته في معركة ديان بيان فو 1954."},{"id":"hi-p57","name":"باو داي Bảo Đại","role":"آخر أباطرة أسرة نغوين في فيتنام، أصبح رئيس دولة فيتنام خلال مرحلة الصراع مع الحركة التحررية الفيتنامية."},{"id":"hi-p58","name":"أحمد سوكارنو Sukarno","role":"زعيم وسياسي إندونيسي، قاد النضال ضد الاستعمار الهولندي، وكان من منظمي مؤتمر باندونغ 1955 ومن مؤسسي حركة عدم الانحياز."},{"id":"hi-p59","name":"ياسر عرفات","role":"زعيم فلسطيني ورئيس منظمة التحرير الفلسطينية، قاد العمل الوطني الفلسطيني، وارتبط اسمه بقيادة منظمة التحرير والنضال من أجل إقامة دولة فلسطينية."},{"id":"hi-p60","name":"مناحيم بيغن Menachem Begin","role":"سياسي إسرائيلي ورئيس وزراء إسرائيل، شارك مع الرئيس المصري أنور السادات والرئيس الأمريكي جيمي كارتر في مسار كامب ديفيد 1978."},{"id":"hi-p61","name":"إسحاق رابين Yitzhak Rabin","role":"سياسي وعسكري إسرائيلي ورئيس وزراء إسرائيل، شارك في مسار المفاوضات مع الفلسطينيين في بداية التسعينيات."},{"id":"hi-p62","name":"محمد أنور السادات","role":"رئيس مصر، قاد مصر خلال حرب أكتوبر 1973، ثم دخل في مفاوضات مع إسرائيل انتهت إلى اتفاقيات كامب ديفيد 1978 ومعاهدة السلام المصرية الإسرائيلية."}],"da  حاجة حاطة عينك عليها، وهذا ماشي كلام تشجيع عادي، هذا واش شايفو فيك بصح.</p>\\n<p>راك طموحة، عندك هدف واضح ENS، تكوني أستاذة لغة إنجليزية، وهذا وحدو دليل انك تعرفي وين رايحة، وبزاف ناس ما عندهمش حتى هذا القد من الوضوح. الطريق للباك صعيب، نعرف، وغادي تكون فيه أيام تحسي فيها راك تعيي أو تشكي في روحك، وهذا طبيعي و كل واحد يعيشو. بصح تفكري: كل موضوع تحليه، كل مراجعة تكمليها، راهي خطوة زايدة تقربك للي تحلمي بيه.</p>\\n<p>ما تخافيش من الصعوبة، خافي بالحرى من انك توقفي قبل ما توصلي. راك أقوى مما تتصوري، وعندك الإصرار اللي يخلي الحلم يتحول لواقع. أنا وكل اللي يعرفوك واثقين فيك بزاف، حتى قبل ما توصلي.</p>\\n<p>فريمجا، يوم من الأيام رايحة تكوني قدام قسم كامل، تعلمي لغة تحبيها، وتكوني القدوة اللي طلاب كثار يحتاجوها. هذا المستقبل راهو ينتظرك، غير كملي بنفس القوة وما تستسلميش.</p>\\n<p>ونتمنى نشوفك يوم توصلي بالضبط لوين تحلمي 💪🎓✨</p>"}]}');let es="bacStandard_v1",eu=new Date("2027-06-06T08:00:00").getTime(),ec=(t(eo)).motivations.filter(e=>!/سندس|فريم|سوجي/.test(e)),ed=t(ei),ep=[{key:"todo",label:"لم أبدأ",emoji:"🔴"},{key:"progress",label:"قيد الحل",emoji:"🟡"},{key:"done",label:"تم الحل",emoji:"🟢"}],em={ar:["اللغة العربية وآدابها","📜"],fr:["اللغة الفرنسية","🥖"],en:["اللغة الإنجليزية","🇬🇧"],es:["اللغة الإسبانية","🇪🇸"],de:["اللغة الألمانية","🇩🇪"],it:["اللغة الإيطالية","🇮🇹"],ph:["الفلسفة","💭"],hg:["التاريخ والجغرافيا","🗺️"],isl:["التربية الإسلامية","🕌"],math:["الرياضيات","📐"],phys:["العلوم الفيزيائية","⚛️"],nat:["علوم الطبيعة والحياة","🧬"],tech:["التكنولوجيا (هندسة)","⚙️"],mgt:["الاقتصاد والمناجمنت","📈"],acc:["التسيير المحاسبي والمالي","🧾"],law:["القانون","⚖️"]},ef=[["ar",3],["fr",2],["en",2],["ph",2],["hg",2],["isl",2]],eh=[{id:"sci",name:"علوم تجريبية",e:"🧬",subs:[["nat",5],["phys",5],["math",5],...ef]},{id:"math",name:"رياضيات",e:"📐",subs:[["math",7],["phys",6],["nat",2],...ef]},{id:"tech",name:"تقني رياضي",e:"⚙️",subs:[["tech",7],["math",6],["phys",5],["ar",2],["fr",2],["en",2],["ph",2],["hg",2],["isl",2]]},{id:"eco",name:"تسيير واقتصاد",e:"📈",subs:[["mgt",5],["acc",5],["math",
